name: Keep Render Alive

on:
  schedule:
    # Ping every 10 minutes to prevent Render free instance from sleeping
    - cron: "*/10 * * * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          echo "Pinging Render app to keep it alive..."
          HTTP_STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "${{ secrets.RENDER_APP_URL }}/api/v1/health" || echo "000")
          echo "Response status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ App is alive"
          elif [ "$HTTP_STATUS" = "000" ]; then
            echo "⚠️ App may be waking up from cold start (this is normal)"
          else
            echo "⚠️ Unexpected status code: $HTTP_STATUS"
          fi
